<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<script>(function(){try{var t=localStorage.getItem('esteira-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>Esteira de Edição — WEN</title>
<link rel="icon" type="image/png" href="assets/logo-wen.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-1:#6812D6; --accent-2:#422DD6; --accent-3:#4CD69E; --accent-4:#D6A81D; --accent-5:#D6312A;
    --accent-gradient:linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-4), var(--accent-5));
    --primary:var(--accent-1); --primary-on:#FFFFFF;
    --red:var(--accent-5); --red-dim:rgba(214,49,42,0.16);
    --yellow:var(--accent-4); --yellow-dim:rgba(214,168,29,0.18);
    --track:var(--accent-3); --track-dim:rgba(76,214,158,0.18);
    --radius:14px;
  }
  :root, :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0B1220; --panel:#121B2E; --panel-2:#1A2740; --panel-3:#22314F;
    --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.22);
    --text:#F5F7FB; --text-muted:#9AA5BD;
    --gray-dim:#1C2438;
    --shadow:0 10px 28px rgba(0,0,0,0.35);
    --shadow-lg:0 20px 48px rgba(0,0,0,0.45);
    --grid-line:rgba(255,255,255,0.07);
    --grid-mask:linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.4) 55%, rgba(0,0,0,0) 92%);
    --glow-1:rgba(201,178,255,0.16);
    --nav-bg:rgba(18,27,46,0.55);
    --glass-bg:rgba(22,20,48,0.38); --glass-bg-strong:rgba(18,17,42,0.55);
    --glass-border:rgba(255,255,255,0.14);
    --page-bg:
      radial-gradient(760px 420px at 50% -8%, var(--glow-1), transparent 65%),
      linear-gradient(180deg, #3A1180 0%, #251668 30%, #171454 62%, #0F1136 88%, #0B0F26 100%);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#F2F6FA; --panel:#FFFFFF; --panel-2:#EEF3F9; --panel-3:#E3EAF4;
    --border:rgba(16,26,43,0.09); --border-strong:rgba(16,26,43,0.18);
    --text:#101A2B; --text-muted:#5B6B85;
    --gray-dim:#E3EAF4;
    --shadow:0 10px 24px rgba(16,26,43,0.10);
    --shadow-lg:0 20px 44px rgba(16,26,43,0.16);
    --grid-line:rgba(16,26,43,0.06);
    --grid-mask:linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.4) 55%, rgba(0,0,0,0) 92%);
    --glow-1:rgba(104,18,214,0.08);
    --nav-bg:rgba(255,255,255,0.6);
    --glass-bg:rgba(255,255,255,0.5); --glass-bg-strong:rgba(255,255,255,0.68);
    --glass-border:rgba(16,26,43,0.12);
    --page-bg:
      radial-gradient(760px 420px at 50% -8%, var(--glow-1), transparent 65%),
      linear-gradient(180deg, #ECE6FB 0%, #E7E9FA 38%, #EDF2FB 72%, #F5F8FC 100%);
  }
  *{box-sizing:border-box;}
  html{min-height:100%;}
  body{
    margin:0;min-height:100vh;color:var(--text);font-family:'Inter',sans-serif;padding:0;
    transition:background-color .25s ease,color .25s ease;
    background:var(--page-bg);
    background-attachment:fixed;
    position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/46px 46px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/46px 46px;
    mask-image:var(--grid-mask); -webkit-mask-image:var(--grid-mask);
  }
  .wrap{max-width:1380px;margin:0 auto;padding:24px 24px 60px;padding-left:max(24px, env(safe-area-inset-left));padding-right:max(24px, env(safe-area-inset-right));}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--nav-bg);border:1px solid var(--border);border-radius:20px;
    padding:12px 16px 12px 14px;margin-bottom:28px;backdrop-filter:blur(10px);
    box-shadow:var(--shadow);transition:background-color .25s ease,border-color .25s ease;
  }
  @media(max-width:700px){
    .wrap{padding:16px 14px 40px;padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right));}
    .topbar{position:sticky;top:10px;z-index:6;padding:10px 12px;margin-bottom:18px;border-radius:16px;}
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;margin:0;letter-spacing:-0.015em;line-height:1.1;color:var(--text);}
  @media(max-width:620px){h1{font-size:23px;}}
  .sub{color:var(--text-muted);font-size:12.5px;margin:3px 0 0;display:flex;align-items:center;gap:7px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gray-dim);flex:none;}
  .dot.online{background:var(--track);box-shadow:0 0 0 3px var(--track-dim);}
  .dot.error{background:var(--red);box-shadow:0 0 0 3px var(--red-dim);}
  .addbtn{background:linear-gradient(rgba(255,255,255,0.16),rgba(255,255,255,0)),rgba(104,18,214,0.62);color:#fff;border:1px solid rgba(255,255,255,0.3);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;padding:11px 18px;border-radius:999px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 20px rgba(104,18,214,0.35);transition:filter .15s ease,transform .15s ease;}
  .addbtn:hover{filter:brightness(1.12);transform:translateY(-1px);}
  .theme-toggle{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--panel-2);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:border-color .15s ease,color .15s ease,background-color .25s ease;}
  .theme-toggle:hover{border-color:var(--border-strong);color:var(--text);}
  .theme-toggle svg{width:17px;height:17px;}
  .theme-toggle .icon-moon{display:none;}
  :root[data-theme="light"] .theme-toggle .icon-sun{display:none;}
  :root[data-theme="light"] .theme-toggle .icon-moon{display:block;}
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start;}
  @media(max-width:1100px){.board{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:700px){
    .board{
      display:flex;grid-template-columns:none;overflow-x:auto;gap:12px;
      scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
      margin:0 -14px;padding:2px 14px 14px;
    }
    .col{flex:0 0 86%;scroll-snap-align:start;max-width:380px;}
  }
  .col{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius);padding:12px;min-height:80px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:var(--shadow);transition:background-color .25s ease,border-color .25s ease;}
  .col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;}
  .col-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text);}
  .col-count{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--track);background:var(--track-dim);padding:2px 8px;border-radius:20px;}
  .cards{display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--glass-bg-strong);border:1px solid var(--glass-border);border-radius:12px;padding:12px 12px 10px;backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%);transition:transform .15s ease,box-shadow .15s ease,background-color .25s ease,border-color .25s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px var(--card-glow, rgba(0,0,0,0.35));border-color:var(--border-strong);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .card-name{font-size:14px;font-weight:500;line-height:1.3;cursor:text;border-bottom:1px dashed transparent;}
  .card-name:hover{border-bottom-color:var(--border-strong);}
  .card-name-input{font-size:14px;font-weight:500;line-height:1.3;background:var(--panel-3);border:1px solid var(--primary);color:var(--text);border-radius:5px;padding:2px 5px;width:100%;font-family:'Inter',sans-serif;}
  .ring{position:relative;width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;}
  .ring-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;background:var(--panel);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;transition:background-color .25s ease;}
  .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);margin-bottom:10px;}
  .fmts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .fmt-chip{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 8px;border-radius:6px;background:var(--panel-3);border:1px solid var(--border);cursor:pointer;user-select:none;color:var(--text-muted);transition:background-color .2s ease,border-color .2s ease,color .2s ease;}
  .fmt-chip input{accent-color:var(--primary);width:12px;height:12px;margin:0;}
  .fmt-chip.done{color:var(--track);border-color:var(--track-dim);background:var(--track-dim);}
  .card-actions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:8px;}
  .movebtns{display:flex;gap:4px;}
  .movebtns button{background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;width:24px;height:24px;font-size:13px;cursor:pointer;line-height:1;}
  .movebtns button:hover{border-color:var(--border-strong);color:var(--text);}
  .iconbtns{display:flex;gap:10px;align-items:center;}
  .iconbtn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:14px;line-height:1;}
  .iconbtn:hover{color:var(--primary);}
  .delbtn:hover{color:var(--red);}
  .empty{color:var(--text-muted);font-size:12px;text-align:center;padding:18px 4px;}
  .modal-bg{position:fixed;inset:0;background:rgba(6,10,20,0.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:10;padding:16px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--glass-bg-strong);border:1px solid var(--glass-border);border-radius:var(--radius);padding:22px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);animation:modalIn .18s ease;}
  @keyframes modalIn{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
  .modal h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;}
  .field .hint{font-size:11px;color:var(--text-muted);margin-top:5px;}
  .field input[type=text],.field input[type=date]{width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 10px;font-family:'Inter',sans-serif;font-size:13px;}
  .field input[type=text]:focus,.field input[type=date]:focus{outline:none;border-color:var(--primary);}
  .checks{display:flex;gap:10px;flex-wrap:wrap;}
  .check{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--panel-2);padding:7px 10px;border-radius:7px;border:1px solid var(--border);cursor:pointer;}
  .check input{accent-color:var(--primary);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:9px 14px;border-radius:7px;font-size:13px;cursor:pointer;}
  .btn-primary{background:var(--primary);color:var(--primary-on);border:none;padding:9px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:filter .15s ease;}
  .btn-primary:hover{filter:brightness(1.08);}
  .loading{color:var(--text-muted);font-size:13px;padding:20px 0;}
  .setup-box{background:var(--panel);border:1px solid var(--red-dim);border-radius:var(--radius);padding:20px 22px;font-size:13px;line-height:1.7;color:var(--text-muted);}
  .setup-box h3{color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 10px;}
  .setup-box code{background:var(--panel-2);padding:2px 6px;border-radius:4px;color:var(--primary);font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .setup-box ol{padding-left:18px;margin:8px 0;}
  @media(max-width:700px){
    .movebtns button{width:34px;height:34px;font-size:16px;}
    .iconbtn{padding:6px;font-size:16px;}
    .theme-toggle{width:42px;height:42px;}
    .addbtn{padding:12px 18px;}
    .fmt-chip{padding:6px 10px;}
    .field input[type=text],.field input[type=date]{font-size:16px;padding:11px 10px;}
    .modal{max-width:none;margin-top:auto;}
    .modal-bg{align-items:flex-end;padding:0;}
    .modal{border-radius:20px 20px 0 0;width:100%;padding-bottom:max(22px, env(safe-area-inset-bottom));animation:modalInMobile .2s ease;}
  }
  @keyframes modalInMobile{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><img src="assets/logo-wen.png" alt="WEN"></div>
      <div>
        <h1>Esteira de edição</h1>
        <div class="sub"><span class="dot" id="status-dot"></span><span id="status-text">Conectando…</span></div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Alternar tema" aria-label="Alternar tema claro/escuro">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button class="addbtn" onclick="openModal()">+ Novo job</button>
    </div>
  </div>
  <div id="board-area"><div class="loading">Carregando jobs…</div></div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2>Novo job de edição</h2>
    <div class="field">
      <label>Nome do episódio / job</label>
      <input type="text" id="f-nome" placeholder="Ex: EP34 — Convidado X">
    </div>
    <div class="field">
      <label>Data de recebimento da decupagem</label>
      <input type="date" id="f-data">
      <div class="hint">Deixe em branco se ainda está em decupagem. O prazo só começa a contar quando a decupagem chega.</div>
    </div>
    <div class="field">
      <label>Formatos necessários</label>
      <div class="checks">
        <label class="check"><input type="checkbox" id="f-integra" checked> Íntegra</label>
        <label class="check"><input type="checkbox" id="f-horizontal"> Corte horizontal</label>
        <label class="check"><input type="checkbox" id="f-vertical"> Corte vertical</label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveNewJob()">Adicionar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =========================================================
   CONFIGURAÇÃO DO FIREBASE — troque pelos valores do SEU projeto
   (Console do Firebase > Configurações do projeto > Seus apps > Config)
   Veja o passo a passo no README.md deste repositório.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCvjdQ8JF5pF25N6jDpu38wr2r4KNdmFTs",
  authDomain: "esteira-edicao-wen.firebaseapp.com",
  databaseURL: "https://esteira-edicao-wen-default-rtdb.firebaseio.com",
  projectId: "esteira-edicao-wen",
  storageBucket: "esteira-edicao-wen.firebasestorage.app",
  messagingSenderId: "549215113152",
  appId: "1:549215113152:web:2a2cb619a5d86b07bfc225"
};
/* ========================================================= */

const DOC_PATH = { collection: 'esteira-edicao', doc: 'jobs' };

const COLUMNS = [
  {id:'decupagem', label:'Em decupagem'},
  {id:'recebido', label:'Recebido'},
  {id:'edicao', label:'Em edição'},
  {id:'revisao', label:'Revisão'},
  {id:'entregue', label:'Entregue'}
];
const FMT_LABEL = {integra:'Íntegra', horizontal:'Corte H', vertical:'Corte V'};
let jobs = [];
let db = null;
let docRef = null;
let suppressNextWrite = false;

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('esteira-theme', theme); }catch(e){}
}
function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

function setStatus(state, text){
  const dot = document.getElementById('status-dot');
  const t = document.getElementById('status-text');
  dot.className = 'dot' + (state ? ' ' + state : '');
  t.textContent = text;
}

function isConfigured(){
  return firebaseConfig.apiKey && firebaseConfig.apiKey !== 'SUA_API_KEY_AQUI';
}

function showSetupNotice(){
  document.getElementById('board-area').innerHTML =
    '<div class="setup-box"><h3>Falta configurar o Firebase</h3>' +
    'Este arquivo ainda está com as chaves de exemplo. Para os dados sincronizarem entre dispositivos:' +
    '<ol>' +
    '<li>Crie um projeto em <code>console.firebase.google.com</code></li>' +
    '<li>Ative o <code>Firestore Database</code> (modo produção)</li>' +
    '<li>Em <code>Authentication → Sign-in method</code>, ative <code>Anonymous</code></li>' +
    '<li>Em <code>Configurações do projeto → Seus apps</code>, crie um app da Web e copie o objeto <code>firebaseConfig</code></li>' +
    '<li>Cole esses valores no início do <code>&lt;script&gt;</code> deste arquivo (<code>index.html</code>), no lugar de <code>firebaseConfig</code>. Veja o passo a passo completo no README.md</li>' +
    '</ol></div>';
}

function initFirebase(){
  if(!isConfigured()){
    setStatus('error', 'Firebase não configurado');
    showSetupNotice();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    docRef = db.collection(DOC_PATH.collection).doc(DOC_PATH.doc);
    firebase.auth().signInAnonymously().catch(err => {
      setStatus('error', 'Erro na autenticação: ' + err.message);
    });
    firebase.auth().onAuthStateChanged(user => {
      if(user){
        setStatus('online', 'Sincronizado');
        listenJobs();
      }
    });
  }catch(e){
    setStatus('error', 'Erro ao iniciar Firebase');
    console.error(e);
  }
}

function listenJobs(){
  docRef.onSnapshot(snap => {
    if(suppressNextWrite){ suppressNextWrite = false; return; }
    const data = snap.data();
    jobs = (data && data.list) ? data.list : [];
    render();
  }, err => {
    setStatus('error', 'Erro ao ler dados: ' + err.message);
    console.error(err);
  });
}

function persist(){
  if(!docRef) return;
  suppressNextWrite = true;
  docRef.set({ list: jobs, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
    .catch(err => {
      setStatus('error', 'Erro ao salvar: ' + err.message);
      console.error(err);
    });
}

function todayISO(){
  const d = new Date();
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10);
}

function addBusinessDays(isoDate, days){
  let d = new Date(isoDate + 'T00:00:00');
  let added = 0;
  while(added < days){
    d.setDate(d.getDate()+1);
    const wd = d.getDay();
    if(wd !== 0 && wd !== 6) added++;
  }
  return d;
}

function businessDaysLeft(deadlineDate){
  const today = new Date(); today.setHours(0,0,0,0);
  const dl = new Date(deadlineDate); dl.setHours(0,0,0,0);
  const sign = dl >= today ? 1 : -1;
  const a = new Date(Math.min(today,dl));
  const b = new Date(Math.max(today,dl));
  let count = 0;
  let d = new Date(a);
  while(d < b){
    d.setDate(d.getDate()+1);
    const wd = d.getDay();
    if(wd !== 0 && wd !== 6) count++;
  }
  return count*sign;
}

function urgencyColor(daysLeft){
  if(daysLeft < 0) return {ring:'var(--red)', dim:'var(--red-dim)', text:'var(--red)'};
  if(daysLeft <= 1) return {ring:'var(--yellow)', dim:'var(--yellow-dim)', text:'var(--yellow)'};
  return {ring:'var(--track)', dim:'var(--track-dim)', text:'var(--text-muted)'};
}

function openModal(){
  document.getElementById('f-nome').value = '';
  document.getElementById('f-data').value = '';
  document.getElementById('f-integra').checked = true;
  document.getElementById('f-horizontal').checked = false;
  document.getElementById('f-vertical').checked = false;
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('f-nome').focus();
}
function closeModal(){
  document.getElementById('modal-bg').classList.remove('open');
}

function saveNewJob(){
  const nome = document.getElementById('f-nome').value.trim();
  const data = document.getElementById('f-data').value || null;
  if(!nome){ document.getElementById('f-nome').focus(); return; }
  const formatos = [];
  if(document.getElementById('f-integra').checked) formatos.push('integra');
  if(document.getElementById('f-horizontal').checked) formatos.push('horizontal');
  if(document.getElementById('f-vertical').checked) formatos.push('vertical');
  if(formatos.length === 0) formatos.push('integra');
  const done = {};
  formatos.forEach(f => done[f] = false);
  jobs.push({
    id: 'job-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
    nome, recebido: data, formatos, done,
    status: data ? 'recebido' : 'decupagem'
  });
  closeModal();
  persist();
  render();
}

function duplicateJob(id){
  const job = jobs.find(j => j.id === id);
  if(!job) return;
  const clone = JSON.parse(JSON.stringify(job));
  clone.id = 'job-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
  clone.nome = job.nome + ' (cópia)';
  Object.keys(clone.done).forEach(k => clone.done[k] = false);
  jobs.push(clone);
  persist();
  render();
}

function toggleFormat(id, fmt){
  const job = jobs.find(j => j.id === id);
  if(!job) return;
  job.done[fmt] = !job.done[fmt];
  persist();
  render();
}

function moveJob(id, dir){
  const job = jobs.find(j => j.id === id);
  if(!job) return;
  const idx = COLUMNS.findIndex(c => c.id === job.status);
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= COLUMNS.length) return;
  const newCol = COLUMNS[newIdx].id;
  if(newCol !== 'decupagem' && !job.recebido){
    job.recebido = todayISO();
  }
  job.status = newCol;
  persist();
  render();
}

function renameJob(id, novoNome){
  const job = jobs.find(j => j.id === id);
  if(!job) return;
  job.nome = novoNome.trim() || job.nome;
  persist();
  render();
}

function deleteJob(id){
  jobs = jobs.filter(j => j.id !== id);
  persist();
  render();
}

function formatDatePt(d){
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}

function render(){
  const area = document.getElementById('board-area');
  const board = document.createElement('div');
  board.className = 'board';

  COLUMNS.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = 'col';
    const colJobs = jobs.filter(j => j.status === col.id).sort((a,b) => {
      if(!a.recebido && !b.recebido) return 0;
      if(!a.recebido) return 1;
      if(!b.recebido) return -1;
      const da = addBusinessDays(a.recebido,4), db2 = addBusinessDays(b.recebido,4);
      return da - db2;
    });

    colEl.innerHTML = '<div class="col-head"><span class="col-title">' + col.label + '</span><span class="col-count">' + colJobs.length + '</span></div>';
    const cardsWrap = document.createElement('div');
    cardsWrap.className = 'cards';

    if(colJobs.length === 0){
      cardsWrap.innerHTML = '<div class="empty">Sem jobs</div>';
    }

    colJobs.forEach(job => {
      const idx = COLUMNS.findIndex(c => c.id === col.id);
      let ringHtml, stateColor, stateDim;
      if(col.id === 'entregue'){
        stateColor = 'var(--track)'; stateDim = 'var(--track-dim)';
        ringHtml = '<div class="ring" style="background:var(--track);">' +
          '<div class="ring-label" style="background:transparent;">' +
          '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"></polyline></svg>' +
          '</div></div>';
      } else if(job.recebido){
        const deadline = addBusinessDays(job.recebido, 4);
        const daysLeft = businessDaysLeft(deadline);
        const uc = urgencyColor(daysLeft);
        stateColor = uc.ring; stateDim = uc.dim;
        let ringLabel = daysLeft < 0 ? 'ATR' : (daysLeft === 0 ? 'HOJE' : daysLeft + 'd');
        const pct = Math.max(0, Math.min(1, (4 - Math.max(daysLeft,0)) / 4));
        ringHtml = '<div class="ring" style="background:conic-gradient(' + uc.ring + ' ' + (pct*360) + 'deg, ' + uc.dim + ' 0deg);">' +
          '<div class="ring-label" style="color:' + uc.text + ';font-size:' + (daysLeft<=0?'8px':'10px') + ';">' + ringLabel + '</div></div>';
      } else {
        stateColor = null; stateDim = null;
        ringHtml = '<div class="ring" style="background:var(--gray-dim);border:1px dashed var(--border-strong);">' +
          '<div class="ring-label" style="color:var(--text-muted);font-size:9px;background:transparent;">—</div></div>';
      }

      const metaText = job.recebido
        ? ('Decupagem ' + formatDatePt(new Date(job.recebido+'T00:00:00')) + ' → prazo ' + formatDatePt(addBusinessDays(job.recebido,4)))
        : 'Aguardando decupagem';

      const card = document.createElement('div');
      card.className = 'card';
      if(stateColor){
        card.style.borderColor = stateDim;
        card.style.setProperty('--card-glow', stateDim);
      }
      card.innerHTML =
        '<div class="card-top">' +
          '<div class="card-name" data-name>' + job.nome + '</div>' +
          ringHtml +
        '</div>' +
        '<div class="meta">' + metaText + '</div>' +
        '<div class="fmts" data-fmts></div>' +
        '<div class="card-actions">' +
          '<div class="movebtns">' +
            '<button ' + (idx===0?'disabled style="opacity:0.3"':'') + ' data-move="-1">‹</button>' +
            '<button ' + (idx===COLUMNS.length-1?'disabled style="opacity:0.3"':'') + ' data-move="1">›</button>' +
          '</div>' +
          '<div class="iconbtns">' +
            '<button class="iconbtn" data-dup title="Duplicar">⧉</button>' +
            '<button class="iconbtn delbtn" data-del title="Remover">✕</button>' +
          '</div>' +
        '</div>';

      const nameEl = card.querySelector('[data-name]');
      nameEl.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'card-name-input';
        input.value = job.nome;
        nameEl.replaceWith(input);
        input.focus();
        input.select();
        const commit = () => renameJob(job.id, input.value);
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (e) => { if(e.key === 'Enter') input.blur(); });
      });

      const fmtsEl = card.querySelector('[data-fmts]');
      job.formatos.forEach(fmt => {
        const chip = document.createElement('label');
        chip.className = 'fmt-chip' + (job.done[fmt] ? ' done' : '');
        chip.innerHTML = '<input type="checkbox" ' + (job.done[fmt]?'checked':'') + '> ' + FMT_LABEL[fmt];
        chip.querySelector('input').addEventListener('change', () => toggleFormat(job.id, fmt));
        fmtsEl.appendChild(chip);
      });

      card.querySelectorAll('[data-move]').forEach(btn => {
        btn.addEventListener('click', () => moveJob(job.id, parseInt(btn.getAttribute('data-move'))));
      });
      card.querySelector('[data-dup]').addEventListener('click', () => duplicateJob(job.id));
      card.querySelector('[data-del]').addEventListener('click', () => {
        if(confirm('Remover "' + job.nome + '" da esteira?')) deleteJob(job.id);
      });

      cardsWrap.appendChild(card);
    });

    colEl.appendChild(cardsWrap);
    board.appendChild(colEl);
  });

  area.innerHTML = '';
  area.appendChild(board);
}

initFirebase();
</script>
</body>
</html>
